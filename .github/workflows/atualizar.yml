name: Atualizar vitrine

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 6h de Brasília (9h UTC)
  push:
    branches: [main]
    paths: [config.json, atualizar.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar data.json com os preços de hoje
        run: node atualizar.mjs
      - name: Salvar o data.json no repositório
        run: |
          git config user.name "vitrine-bot"
          git config user.email "vitrine-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Preços de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
